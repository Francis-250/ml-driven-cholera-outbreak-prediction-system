<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="dropGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#059669" stop-opacity="0.1"/>
    </linearGradient>
  </defs>

  <!-- Base Squircle -->
  <rect width="128" height="128" rx="28" fill="url(#bgGrad)"/>
  <rect width="126" height="126" x="1" y="1" rx="27" fill="none" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="2"/>

  <!-- Radar Pulse Rings -->
  <circle cx="64" cy="70" r="46" fill="none" stroke="#0ea5e9" stroke-opacity="0.25" stroke-width="1.5" stroke-dasharray="4 3"/>
  <circle cx="64" cy="70" r="38" fill="none" stroke="#10b981" stroke-opacity="0.2" stroke-width="1"/>

  <!-- Water Droplet Outer Glow -->
  <path d="M64 20 C64 20, 32 55, 32 76 A32 32 0 0 0 96 76 C96 55, 64 20, 64 20 Z"
        fill="url(#glowGrad)"/>

  <!-- Water Droplet Core -->
  <path d="M64 24 C64 24, 36 57, 36 76 A28 28 0 0 0 92 76 C92 57, 64 24, 64 24 Z"
        fill="url(#dropGrad)"/>

  <!-- Droplet Specular Highlight -->
  <ellipse cx="50" cy="62" rx="5" ry="10" transform="rotate(-30 50 62)" fill="#ffffff" fill-opacity="0.4"/>

  <!-- Medical Cross / Clinical Shield Element -->
  <g fill="#ffffff" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.3))">
    <rect x="58" y="55" width="12" height="32" rx="3"/>
    <rect x="48" y="65" width="32" height="12" rx="3"/>
  </g>

  <!-- Center Biosensor Indicator -->
  <circle cx="64" cy="71" r="3.5" fill="#0284c7"/>
</svg>